[project]
name = "my-business-hotel-hr"
version = "0.1.0"
description = "Local-first HR and payroll system for M.Y. Business Hotel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "pwdlib[argon2]>=0.2",
  "itsdangerous>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "alembic>=1.13,<2",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]
namespaces = false
