<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — M.Y. Business Hotel HR</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login-shell">
    <form class="login-card" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <p class="eyebrow">M.Y. BUSINESS HOTEL</p>
      <h1>تسجيل دخول الإدارة</h1>
      <p class="muted small">نظام الموارد البشرية والرواتب المحلي — حساب مسؤول واحد فقط.</p>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label>اسم المستخدم
        <input name="username" autocomplete="username" required maxlength="80" placeholder="اسم المستخدم">
      </label>
      <label>كلمة المرور
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••••••">
      </label>
      <button type="submit" class="btn-primary">دخول إلى النظام</button>
      <p class="muted small" style="margin-top:14px">يعمل محليًا على Windows 10 / 11 — لا يُعرض على الإنترنت.</p>
    </form>
  </main>
</body>
</html>
