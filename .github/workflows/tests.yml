name: Python test suite

on:
  push:
    branches:
      - feature/auth-security
      - feature/platform-hardening
      - work/leave-management-foundation
      - work/rewards-sanctions-v2
      - work/payroll-foundation
  pull_request:
    branches:
      - main
      - feature/auth-security
      - work/leave-management-foundation
      - work/rewards-sanctions-v2
      - work/payroll-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run pytest (Python 3.11)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_test -d hotel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://hotel_test:test-only-password@localhost:5432/hotel_test
      SESSION_SECRET: ci-test-only-session-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run complete test suite with diagnostic reports
        run: python scripts/ci_pytest_runner.py

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-linux
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows runner compatibility (Python 3.11)
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql+psycopg://ci_placeholder:ci_placeholder@127.0.0.1:5432/ci_placeholder
      SESSION_SECRET: ci-test-only-session-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run platform-independent test suite with diagnostic reports
        run: python scripts/ci_pytest_runner.py --ignore=tests/test_postgres_migrations.py

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-windows
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
